components:
  schemas:
    BankTransferPayment:
      description: Chuyển khoản ngân hàng
      example:
        method: BANK_TRANSFER
        bankCode: VCB
        transferRef: FT26016ABC
      properties:
        method:
          type: string
          enum:
          - BANK_TRANSFER
          example: BANK_TRANSFER
          minLength: 1
        bankCode:
          type: string
          example: VCB
          minLength: 1
        transferRef:
          type: string
          example: FT26016ABC
          minLength: 1
      required:
      - bankCode
      - method
      - transferRef
    CardPayment:
      description: Thanh toán thẻ
      example:
        method: CARD
        provider: VISA
        last4: "4242"
      properties:
        method:
          type: string
          enum:
          - CARD
          example: CARD
          minLength: 1
        provider:
          type: string
          description: Tổ chức thẻ
          example: VISA
          minLength: 1
        last4:
          type: string
          description: 4 số cuối của thẻ
          example: "4242"
          minLength: 1
          pattern: "\\d{4}"
      required:
      - last4
      - method
      - provider
    CodPayment:
      description: Thanh toán khi nhận hàng
      example:
        method: COD
      properties:
        method:
          type: string
          enum:
          - COD
          example: COD
          minLength: 1
      required:
      - method
    CreateOrderRequest:
      type: object
      description: Tạo đơn. Client không gửi giá; server chụp giá sản phẩm tại thời
        điểm đặt.
      properties:
        shippingAddress:
          type: string
          example: "12 Nguyen Hue, Quan 1, TP.HCM"
          maxLength: 500
          minLength: 0
        payment:
          $ref: "#/components/schemas/Payment"
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderLineRequest"
          maxItems: 50
          minItems: 0
      required:
      - items
      - payment
      - shippingAddress
    OrderLineRequest:
      type: object
      properties:
        productId:
          type: integer
          format: int64
          example: 1
        quantity:
          type: integer
          format: int32
          example: 1
          maximum: 20
          minimum: 1
      required:
      - productId
      - quantity
    Payment:
      description: Phương thức thanh toán. oneOf theo discriminator method.
      discriminator:
        propertyName: method
        mapping:
          COD: "#/components/schemas/CodPayment"
          BANK_TRANSFER: "#/components/schemas/BankTransferPayment"
          CARD: "#/components/schemas/CardPayment"
      oneOf:
      - $ref: "#/components/schemas/CodPayment"
      - $ref: "#/components/schemas/CardPayment"
      - $ref: "#/components/schemas/BankTransferPayment"
    OrderCreatedResponse:
      type: object
      properties:
        code:
          type: string
          example: ORD-2026-000001
        status:
          type: string
          enum:
          - PENDING
          - CONFIRMED
          - SHIPPING
          - DELIVERED
          - CANCELLED
          - RETURN_REQUESTED
          - RETURNED
        totalAmount:
          type: number
          example: 1590000
        currency:
          type: string
          example: VND
        version:
          type: integer
          format: int64
          example: 0
        createdAt:
          type: string
          format: date-time
    TransitionRequest:
      type: object
      properties:
        action:
          $ref: "#/components/schemas/OrderAction"
        reason:
          type: string
          description: Bắt buộc khi ADMIN hủy đơn đang CONFIRMED
          example: Khách đổi ý
          maxLength: 500
          minLength: 0
      required:
      - action
    TransitionResponse:
      type: object
      properties:
        code:
          type: string
          example: ORD-2026-000001
        status:
          type: string
          enum:
          - PENDING
          - CONFIRMED
          - SHIPPING
          - DELIVERED
          - CANCELLED
          - RETURN_REQUESTED
          - RETURNED
        version:
          type: integer
          format: int64
          example: 1
    OrderPage:
      type: object
      description: "Trang đơn hàng với content, page, size và totalElements."
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/OrderSummary"
        page:
          type: integer
          format: int32
          example: 0
        size:
          type: integer
          format: int32
          example: 20
        totalElements:
          type: integer
          format: int64
          example: 1
        totalPages:
          type: integer
          format: int32
          example: 1
        first:
          type: boolean
        last:
          type: boolean
    OrderSummary:
      type: object
      properties:
        code:
          type: string
          example: ORD-2026-000001
        status:
          type: string
          enum:
          - PENDING
          - CONFIRMED
          - SHIPPING
          - DELIVERED
          - CANCELLED
          - RETURN_REQUESTED
          - RETURNED
        totalAmount:
          type: number
          example: 1590000
        currency:
          type: string
          example: VND
        createdAt:
          type: string
          format: date-time
    OrderDetailV1:
      type: object
      description: Chi tiết đơn phiên bản 1. totalAmount là số. Ngừng hỗ trợ 2027-04-01.
      properties:
        code:
          type: string
          example: ORD-2026-000001
        customerId:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - PENDING
          - CONFIRMED
          - SHIPPING
          - DELIVERED
          - CANCELLED
          - RETURN_REQUESTED
          - RETURNED
        shippingAddress:
          type: string
        totalAmount:
          type: number
          description: Tổng tiền dạng số. Deprecated cùng operation.
          example: 1590000
        currency:
          type: string
          example: VND
        version:
          type: integer
          format: int64
          example: 0
        payment:
          $ref: "#/components/schemas/Payment"
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemResponse"
        createdAt:
          type: string
          format: date-time
        deliveredAt:
          type: string
          format: date-time
    OrderItemResponse:
      type: object
      properties:
        productId:
          type: integer
          format: int64
          example: 1
        productName:
          type: string
          example: Bàn phím cơ K8 Pro
        unitPrice:
          type: number
          example: 1590000
        quantity:
          type: integer
          format: int32
          example: 1
        lineTotal:
          type: number
          example: 1590000
    ApiProblem:
      description: "RFC 9457 Problem Details, thêm code và errors"
      properties:
        type:
          type: string
          format: uri
          example: https://api.example.com/errors/validation
        title:
          type: string
          example: Validation failed
        status:
          type: integer
          format: int32
          example: 400
        detail:
          type: string
          example: Invalid request content.
        instance:
          type: string
          format: uri
          example: /api/orders
        code:
          type: string
          example: VALIDATION_FAILED
        timestamp:
          type: string
          format: date-time
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ApiFieldError"
    ApiFieldError:
      description: Một lỗi gắn với trường của request
      properties:
        field:
          type: string
          example: name
        message:
          type: string
          example: must not be blank
    OrderAction:
      type: string
      description: |-
        CANCEL: CUSTOMER chỉ khi đơn của mình còn PENDING; không dùng cho CONFIRMED.
        REQUEST_RETURN: CUSTOMER trên đơn của mình, chỉ khi DELIVERED và trong 7 ngày kể từ lúc giao.
      enum:
      - CANCEL
      - REQUEST_RETURN
  securitySchemes:
    bearerAuth:
      type: http
      description: JWT HS256. Claim role là CUSTOMER hoặc ADMIN. CUSTOMER kèm customerId.
      scheme: bearer
      bearerFormat: JWT
