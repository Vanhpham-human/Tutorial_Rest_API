openapi: 3.1.0
info:
  title: TechShop Partner API
  description: Hợp đồng đối tác vận chuyển. Xác thực bằng header X-Partner-Key.
  contact:
    name: Catalog Team
    email: catalog@example.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: 1.0.0
externalDocs:
  description: Hướng dẫn tích hợp
  url: https://example.com/docs/catalog
servers:
- url: http://localhost:8080
  description: Môi trường hiện tại
tags:
- name: Shipping
  description: Webhook đối tác vận chuyển
paths:
  /api/webhooks/shipping:
    post:
      tags:
      - Shipping
      summary: Đối tác báo vận chuyển
      description: "X-Partner-Key. SHIP khi đơn CONFIRMED, DELIVER hoặc FAIL_DELIVERY\
        \ khi đơn SHIPPING. FAIL_DELIVERY đưa đơn về CONFIRMED để giao lại."
      operationId: shippingWebhook
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShippingWebhookRequest"
        required: true
      responses:
        "200":
          description: Đã ghi nhận
          headers:
            X-Request-Id:
              description: "Định danh tương quan. Server echo giá trị client gửi,\
                \ hoặc sinh UUID nếu thiếu."
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionResponse"
        "400":
          description: "MALFORMED_JSON: Malformed JSON; VALIDATION_FAILED: Validation\
            \ failed"
          headers:
            X-Request-Id:
              description: "Định danh tương quan. Server echo giá trị client gửi,\
                \ hoặc sinh UUID nếu thiếu."
              schema:
                type: string
                format: uuid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
              examples:
                MALFORMED_JSON:
                  summary: Malformed JSON
                  value:
                    type: https://api.example.com/errors/malformed-json
                    status: 400
                    instance: /api/orders
                    code: MALFORMED_JSON
                    detail: Body không phải JSON hợp lệ
                    timestamp: 2026-10-16T03:12:45.120Z
                    title: Malformed JSON
                VALIDATION_FAILED:
                  summary: Validation failed
                  value:
                    errors:
                    - message: must not be empty
                      field: items
                    code: VALIDATION_FAILED
                    detail: Invalid request content.
                    status: 400
                    instance: /api/orders
                    timestamp: 2026-10-16T03:12:45.120Z
                    title: Validation failed
                    type: https://api.example.com/errors/validation-failed
        "401":
          description: "PARTNER_KEY_INVALID: Invalid partner key"
          headers:
            X-Request-Id:
              description: "Định danh tương quan. Server echo giá trị client gửi,\
                \ hoặc sinh UUID nếu thiếu."
              schema:
                type: string
                format: uuid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
              examples:
                PARTNER_KEY_INVALID:
                  summary: Invalid partner key
                  value:
                    type: https://api.example.com/errors/partner-key-invalid
                    status: 401
                    instance: /api/webhooks/shipping
                    code: PARTNER_KEY_INVALID
                    detail: Header X-Partner-Key không hợp lệ
                    timestamp: 2026-10-16T03:12:45.120Z
                    title: Invalid partner key
        "404":
          description: "ORDER_NOT_FOUND: Order not found"
          headers:
            X-Request-Id:
              description: "Định danh tương quan. Server echo giá trị client gửi,\
                \ hoặc sinh UUID nếu thiếu."
              schema:
                type: string
                format: uuid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
              examples:
                ORDER_NOT_FOUND:
                  summary: Order not found
                  value:
                    type: https://api.example.com/errors/order-not-found
                    status: 404
                    instance: /api/orders/ORD-2026-000999
                    code: ORDER_NOT_FOUND
                    detail: Không tìm thấy đơn ORD-2026-000999
                    timestamp: 2026-10-16T03:12:45.120Z
                    title: Order not found
        "409":
          description: "ORDER_INVALID_TRANSITION: Invalid transition"
          headers:
            X-Request-Id:
              description: "Định danh tương quan. Server echo giá trị client gửi,\
                \ hoặc sinh UUID nếu thiếu."
              schema:
                type: string
                format: uuid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
              examples:
                ORDER_INVALID_TRANSITION:
                  summary: Invalid transition
                  value:
                    type: https://api.example.com/errors/order-invalid-transition
                    status: 409
                    instance: /api/orders/ORD-2026-000001/transitions
                    code: ORDER_INVALID_TRANSITION
                    detail: Không thể CANCEL khi đơn đang ở trạng thái SHIPPING
                    timestamp: 2026-10-16T03:12:45.120Z
                    title: Invalid transition
      security:
      - partnerKey: []
components:
  schemas:
    ShippingWebhookRequest:
      type: object
      properties:
        orderCode:
          type: string
          example: ORD-2026-000001
          minLength: 1
        action:
          $ref: "#/components/schemas/OrderAction"
        reason:
          type: string
          maxLength: 500
          minLength: 0
      required:
      - action
      - orderCode
    TransitionResponse:
      type: object
      properties:
        code:
          type: string
          example: ORD-2026-000001
        status:
          type: string
          enum:
          - PENDING
          - CONFIRMED
          - SHIPPING
          - DELIVERED
          - CANCELLED
          - RETURN_REQUESTED
          - RETURNED
        version:
          type: integer
          format: int64
          example: 1
    ApiProblem:
      description: "RFC 9457 Problem Details, thêm code và errors"
      properties:
        type:
          type: string
          format: uri
          example: https://api.example.com/errors/validation
        title:
          type: string
          example: Validation failed
        status:
          type: integer
          format: int32
          example: 400
        detail:
          type: string
          example: Invalid request content.
        instance:
          type: string
          format: uri
          example: /api/orders
        code:
          type: string
          example: VALIDATION_FAILED
        timestamp:
          type: string
          format: date-time
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ApiFieldError"
    ApiFieldError:
      description: Một lỗi gắn với trường của request
      properties:
        field:
          type: string
          example: name
        message:
          type: string
          example: must not be blank
    OrderAction:
      type: string
      description: |-
        SHIP: đối tác, CONFIRMED → SHIPPING.
        DELIVER: đối tác, SHIPPING → DELIVERED.
        FAIL_DELIVERY: đối tác, SHIPPING → CONFIRMED (giao thất bại, giao lại).
      enum:
      - SHIP
      - DELIVER
      - FAIL_DELIVERY
  securitySchemes:
    partnerKey:
      type: apiKey
      description: API key của đối tác vận chuyển
      name: X-Partner-Key
      in: header
