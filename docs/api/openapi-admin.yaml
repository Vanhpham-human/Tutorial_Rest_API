openapi: 3.1.0
info:
  title: TechShop Admin API
  description: Hợp đồng quản trị. ADMIN thực hiện mọi action hợp lệ của máy trạng
    thái. Hủy đơn CONFIRMED bắt buộc có reason.
  contact:
    name: Catalog Team
    email: catalog@example.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: 1.0.0
externalDocs:
  description: Hướng dẫn tích hợp
  url: https://example.com/docs/catalog
servers:
- url: http://localhost:8080
  description: Môi trường hiện tại
tags:
- name: Orders
  description: Đặt và theo dõi đơn hàng
- name: Invoices
  description: Hóa đơn PDF của đơn
- name: Reports
  description: Báo cáo nội bộ
paths:
  /api/orders/{code}/transitions:
    post:
      tags:
      - Orders
      summary: Chuyển trạng thái đơn
      description: "ADMIN được mọi action đúng trạng thái. CUSTOMER chỉ CANCEL khi\
        \ đơn của mình còn PENDING, và REQUEST_RETURN trong 7 ngày sau DELIVERED.\
        \ Hủy CONFIRMED chỉ ADMIN và bắt buộc reason. If-Match phải khớp version."
      operationId: transitionOrder
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: "ETag version hiện tại, ví dụ \"0\""
        required: true
        schema:
          type: string
        example: "0"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionRequest"
        required: true
      responses:
        "200":
          description: Đã chuyển trạng thái
          headers:
            X-Request-Id:
              description: "Định danh tương quan. Server echo giá trị client gửi,\
                \ hoặc sinh UUID nếu thiếu."
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionResponse"
        "400":
          description: "VALIDATION_FAILED: Validation failed; MALFORMED_JSON: Malformed\
            \ JSON; REASON_REQUIRED: Reason required"
          headers:
            X-Request-Id:
              description: "Định danh tương quan. Server echo giá trị client gửi,\
                \ hoặc sinh UUID nếu thiếu."
              schema:
                type: string
                format: uuid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
              examples:
                VALIDATION_FAILED:
                  summary: Validation failed
                  value:
                    errors:
                    - message: must not be empty
                      field: items
                    code: VALIDATION_FAILED
                    detail: Invalid request content.
                    status: 400
                    instance: /api/orders
                    timestamp: 2026-10-16T03:12:45.120Z
                    title: Validation failed
                    type: https://api.example.com/errors/validation-failed
                MALFORMED_JSON:
                  summary: Malformed JSON
                  value:
                    type: https://api.example.com/errors/malformed-json
                    status: 400
                    instance: /api/orders
                    code: MALFORMED_JSON
                    detail: Body không phải JSON hợp lệ
                    timestamp: 2026-10-16T03:12:45.120Z
                    title: Malformed JSON
                REASON_REQUIRED:
                  summary: Reason required
                  value:
                    type: https://api.example.com/errors/reason-required
                    status: 400
                    instance: /api/orders/ORD-2026-000001/transitions
                    code: REASON_REQUIRED
                    detail: Hủy đơn CONFIRMED bắt buộc có reason
                    timestamp: 2026-10-16T03:12:45.120Z
                    title: Reason required
        "401":
          description: "UNAUTHORIZED: Unauthorized"
          headers:
            X-Request-Id:
              description: "Định danh tương quan. Server echo giá trị client gửi,\
                \ hoặc sinh UUID nếu thiếu."
              schema:
                type: string
                format: uuid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
              examples:
                UNAUTHORIZED:
                  summary: Unauthorized
                  value:
                    type: https://api.example.com/errors/unauthorized
                    status: 401
                    instance: /api/orders
                    code: UNAUTHORIZED
                    detail: Thiếu hoặc sai token
                    timestamp: 2026-10-16T03:12:45.120Z
                    title: Unauthorized
        "403":
          description: "FORBIDDEN: Forbidden"
          headers:
            X-Request-Id:
              description: "Định danh tương quan. Server echo giá trị client gửi,\
                \ hoặc sinh UUID nếu thiếu."
              schema:
                type: string
                format: uuid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
              examples:
                FORBIDDEN:
                  summary: Forbidden
                  value:
                    type: https://api.example.com/errors/forbidden
                    status: 403
                    instance: /api/orders/ORD-2026-000001/transitions
                    code: FORBIDDEN
                    detail: Không có quyền thực hiện thao tác này
                    timestamp: 2026-10-16T03:12:45.120Z
                    title: Forbidden
        "404":
          description: "ORDER_NOT_FOUND: Order not found"
          headers:
            X-Request-Id:
              description: "Định danh tương quan. Server echo giá trị client gửi,\
                \ hoặc sinh UUID nếu thiếu."
              schema:
                type: string
                format: uuid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
              examples:
                ORDER_NOT_FOUND:
                  summary: Order not found
                  value:
                    type: https://api.example.com/errors/order-not-found
                    status: 404
                    instance: /api/orders/ORD-2026-000999
                    code: ORDER_NOT_FOUND
                    detail: Không tìm thấy đơn ORD-2026-000999
                    timestamp: 2026-10-16T03:12:45.120Z
                    title: Order not found
        "409":
          description: "ORDER_INVALID_TRANSITION: Invalid transition; RETURN_WINDOW_EXPIRED:\
            \ Return window expired"
          headers:
            X-Request-Id:
              description: "Định danh tương quan. Server echo giá trị client gửi,\
                \ hoặc sinh UUID nếu thiếu."
              schema:
                type: string
                format: uuid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
              examples:
                ORDER_INVALID_TRANSITION:
                  summary: Invalid transition
                  value:
                    type: https://api.example.com/errors/order-invalid-transition
                    status: 409
                    instance: /api/orders/ORD-2026-000001/transitions
                    code: ORDER_INVALID_TRANSITION
                    detail: Không thể CANCEL khi đơn đang ở trạng thái SHIPPING
                    timestamp: 2026-10-16T03:12:45.120Z
                    title: Invalid transition
                RETURN_WINDOW_EXPIRED:
                  summary: Return window expired
                  value:
                    type: https://api.example.com/errors/return-window-expired
                    status: 409
                    instance: /api/orders/ORD-2026-000001/transitions
                    code: RETURN_WINDOW_EXPIRED
                    detail: Chỉ được yêu cầu trả hàng trong 7 ngày kể từ khi giao
                    timestamp: 2026-10-16T03:12:45.120Z
                    title: Return window expired
        "412":
          description: "PRECONDITION_FAILED: Precondition failed"
          headers:
            X-Request-Id:
              description: "Định danh tương quan. Server echo giá trị client gửi,\
                \ hoặc sinh UUID nếu thiếu."
              schema:
                type: string
                format: uuid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
              examples:
                PRECONDITION_FAILED:
                  summary: Precondition failed
                  value:
                    type: https://api.example.com/errors/precondition-failed
                    status: 412
                    instance: /api/orders/ORD-2026-000001/transitions
                    code: PRECONDITION_FAILED
                    detail: If-Match không khớp version hiện tại
                    timestamp: 2026-10-16T03:12:45.120Z
                    title: Precondition failed
        "428":
          description: "PRECONDITION_REQUIRED: Precondition required"
          headers:
            X-Request-Id:
              description: "Định danh tương quan. Server echo giá trị client gửi,\
                \ hoặc sinh UUID nếu thiếu."
              schema:
                type: string
                format: uuid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
              examples:
                PRECONDITION_REQUIRED:
                  summary: Precondition required
                  value:
                    type: https://api.example.com/errors/precondition-required
                    status: 428
                    instance: /api/orders/ORD-2026-000001/transitions
                    code: PRECONDITION_REQUIRED
                    detail: Header If-Match là bắt buộc
                    timestamp: 2026-10-16T03:12:45.120Z
                    title: Precondition required
      security:
      - bearerAuth: []
  /api/orders/{code}/invoice:
    post:
      tags:
      - Invoices
      summary: Tải hóa đơn PDF
      description: "ADMIN upload multipart field file. Chỉ PDF, tối đa 5MB."
      operationId: uploadInvoice
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: "File PDF, tối đa 5MB"
              required:
              - file
            encoding:
              file:
                contentType: application/pdf
      responses:
        "201":
          description: Đã lưu hóa đơn
          headers:
            X-Request-Id:
              description: "Định danh tương quan. Server echo giá trị client gửi,\
                \ hoặc sinh UUID nếu thiếu."
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceMetadata"
        "401":
          description: "UNAUTHORIZED: Unauthorized"
          headers:
            X-Request-Id:
              description: "Định danh tương quan. Server echo giá trị client gửi,\
                \ hoặc sinh UUID nếu thiếu."
              schema:
                type: string
                format: uuid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
              examples:
                UNAUTHORIZED:
                  summary: Unauthorized
                  value:
                    type: https://api.example.com/errors/unauthorized
                    status: 401
                    instance: /api/orders
                    code: UNAUTHORIZED
                    detail: Thiếu hoặc sai token
                    timestamp: 2026-10-16T03:12:45.120Z
                    title: Unauthorized
        "403":
          description: "FORBIDDEN: Forbidden"
          headers:
            X-Request-Id:
              description: "Định danh tương quan. Server echo giá trị client gửi,\
                \ hoặc sinh UUID nếu thiếu."
              schema:
                type: string
                format: uuid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
              examples:
                FORBIDDEN:
                  summary: Forbidden
                  value:
                    type: https://api.example.com/errors/forbidden
                    status: 403
                    instance: /api/orders/ORD-2026-000001/transitions
                    code: FORBIDDEN
                    detail: Không có quyền thực hiện thao tác này
                    timestamp: 2026-10-16T03:12:45.120Z
                    title: Forbidden
        "404":
          description: "ORDER_NOT_FOUND: Order not found"
          headers:
            X-Request-Id:
              description: "Định danh tương quan. Server echo giá trị client gửi,\
                \ hoặc sinh UUID nếu thiếu."
              schema:
                type: string
                format: uuid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
              examples:
                ORDER_NOT_FOUND:
                  summary: Order not found
                  value:
                    type: https://api.example.com/errors/order-not-found
                    status: 404
                    instance: /api/orders/ORD-2026-000999
                    code: ORDER_NOT_FOUND
                    detail: Không tìm thấy đơn ORD-2026-000999
                    timestamp: 2026-10-16T03:12:45.120Z
                    title: Order not found
        "415":
          description: "INVOICE_NOT_PDF: Invoice is not a PDF"
          headers:
            X-Request-Id:
              description: "Định danh tương quan. Server echo giá trị client gửi,\
                \ hoặc sinh UUID nếu thiếu."
              schema:
                type: string
                format: uuid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
              examples:
                INVOICE_NOT_PDF:
                  summary: Invoice is not a PDF
                  value:
                    type: https://api.example.com/errors/invoice-not-pdf
                    status: 415
                    instance: /api/orders/ORD-2026-000001/invoice
                    code: INVOICE_NOT_PDF
                    detail: Chỉ nhận file PDF
                    timestamp: 2026-10-16T03:12:45.120Z
                    title: Invoice is not a PDF
        "413":
          description: "INVOICE_TOO_LARGE: Invoice too large"
          headers:
            X-Request-Id:
              description: "Định danh tương quan. Server echo giá trị client gửi,\
                \ hoặc sinh UUID nếu thiếu."
              schema:
                type: string
                format: uuid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
              examples:
                INVOICE_TOO_LARGE:
                  summary: Invoice too large
                  value:
                    type: https://api.example.com/errors/invoice-too-large
                    status: 413
                    instance: /api/orders/ORD-2026-000001/invoice
                    code: INVOICE_TOO_LARGE
                    detail: Hóa đơn vượt quá 5MB
                    timestamp: 2026-10-16T03:12:45.120Z
                    title: Invoice too large
        "400":
          description: "VALIDATION_FAILED: Validation failed"
          headers:
            X-Request-Id:
              description: "Định danh tương quan. Server echo giá trị client gửi,\
                \ hoặc sinh UUID nếu thiếu."
              schema:
                type: string
                format: uuid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
              examples:
                VALIDATION_FAILED:
                  summary: Validation failed
                  value:
                    errors:
                    - message: must not be empty
                      field: items
                    code: VALIDATION_FAILED
                    detail: Invalid request content.
                    status: 400
                    instance: /api/orders
                    timestamp: 2026-10-16T03:12:45.120Z
                    title: Validation failed
                    type: https://api.example.com/errors/validation-failed
      security:
      - bearerAuth: []
  /api/admin/reports/daily-revenue:
    get:
      tags:
      - Reports
      summary: Doanh thu theo ngày
      description: ADMIN. Tính các đơn DELIVERED hoặc RETURN_REQUESTED theo ngày giao
        (UTC). Đơn RETURNED không tính.
      operationId: dailyRevenue
      parameters:
      - name: from
        in: query
        description: "Từ ngày (UTC, inclusive). Mặc định 30 ngày gần nhất."
        required: false
        schema:
          type: string
          format: date
          description: "Từ ngày (UTC, inclusive). Mặc định 30 ngày gần nhất."
      - name: to
        in: query
        description: "Đến ngày (UTC, inclusive). Mặc định hôm nay."
        required: false
        schema:
          type: string
          format: date
          description: "Đến ngày (UTC, inclusive). Mặc định hôm nay."
      responses:
        "200":
          description: Báo cáo doanh thu
          headers:
            X-Request-Id:
              description: "Định danh tương quan. Server echo giá trị client gửi,\
                \ hoặc sinh UUID nếu thiếu."
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyRevenueReport"
        "401":
          description: "UNAUTHORIZED: Unauthorized"
          headers:
            X-Request-Id:
              description: "Định danh tương quan. Server echo giá trị client gửi,\
                \ hoặc sinh UUID nếu thiếu."
              schema:
                type: string
                format: uuid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
              examples:
                UNAUTHORIZED:
                  summary: Unauthorized
                  value:
                    type: https://api.example.com/errors/unauthorized
                    status: 401
                    instance: /api/orders
                    code: UNAUTHORIZED
                    detail: Thiếu hoặc sai token
                    timestamp: 2026-10-16T03:12:45.120Z
                    title: Unauthorized
        "403":
          description: "FORBIDDEN: Forbidden"
          headers:
            X-Request-Id:
              description: "Định danh tương quan. Server echo giá trị client gửi,\
                \ hoặc sinh UUID nếu thiếu."
              schema:
                type: string
                format: uuid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
              examples:
                FORBIDDEN:
                  summary: Forbidden
                  value:
                    type: https://api.example.com/errors/forbidden
                    status: 403
                    instance: /api/orders/ORD-2026-000001/transitions
                    code: FORBIDDEN
                    detail: Không có quyền thực hiện thao tác này
                    timestamp: 2026-10-16T03:12:45.120Z
                    title: Forbidden
        "400":
          description: "INVALID_DATE_RANGE: Invalid date range; VALIDATION_FAILED:\
            \ Validation failed"
          headers:
            X-Request-Id:
              description: "Định danh tương quan. Server echo giá trị client gửi,\
                \ hoặc sinh UUID nếu thiếu."
              schema:
                type: string
                format: uuid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
              examples:
                INVALID_DATE_RANGE:
                  summary: Invalid date range
                  value:
                    type: https://api.example.com/errors/invalid-date-range
                    status: 400
                    instance: /api/orders
                    code: INVALID_DATE_RANGE
                    detail: from phải nhỏ hơn hoặc bằng to
                    timestamp: 2026-10-16T03:12:45.120Z
                    title: Invalid date range
                VALIDATION_FAILED:
                  summary: Validation failed
                  value:
                    errors:
                    - message: must not be empty
                      field: items
                    code: VALIDATION_FAILED
                    detail: Invalid request content.
                    status: 400
                    instance: /api/orders
                    timestamp: 2026-10-16T03:12:45.120Z
                    title: Validation failed
                    type: https://api.example.com/errors/validation-failed
      security:
      - bearerAuth: []
components:
  schemas:
    TransitionRequest:
      type: object
      properties:
        action:
          $ref: "#/components/schemas/OrderAction"
        reason:
          type: string
          description: Bắt buộc khi ADMIN hủy đơn đang CONFIRMED
          example: Khách đổi ý
          maxLength: 500
          minLength: 0
      required:
      - action
    TransitionResponse:
      type: object
      properties:
        code:
          type: string
          example: ORD-2026-000001
        status:
          type: string
          enum:
          - PENDING
          - CONFIRMED
          - SHIPPING
          - DELIVERED
          - CANCELLED
          - RETURN_REQUESTED
          - RETURNED
        version:
          type: integer
          format: int64
          example: 1
    InvoiceMetadata:
      type: object
      properties:
        orderCode:
          type: string
          example: ORD-2026-000001
        fileName:
          type: string
          example: invoice.pdf
        sizeBytes:
          type: integer
          format: int64
          example: 1024
        uploadedAt:
          type: string
          format: date-time
    DailyRevenuePoint:
      type: object
      properties:
        date:
          type: string
          format: date
        amount:
          type: number
          example: 1590000
        orderCount:
          type: integer
          format: int64
          example: 1
    DailyRevenueReport:
      type: object
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        currency:
          type: string
        total:
          type: number
        days:
          type: array
          items:
            $ref: "#/components/schemas/DailyRevenuePoint"
    ApiProblem:
      description: "RFC 9457 Problem Details, thêm code và errors"
      properties:
        type:
          type: string
          format: uri
          example: https://api.example.com/errors/validation
        title:
          type: string
          example: Validation failed
        status:
          type: integer
          format: int32
          example: 400
        detail:
          type: string
          example: Invalid request content.
        instance:
          type: string
          format: uri
          example: /api/orders
        code:
          type: string
          example: VALIDATION_FAILED
        timestamp:
          type: string
          format: date-time
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ApiFieldError"
    ApiFieldError:
      description: Một lỗi gắn với trường của request
      properties:
        field:
          type: string
          example: name
        message:
          type: string
          example: must not be blank
    OrderAction:
      type: string
      description: |-
        CONFIRM: ADMIN, PENDING → CONFIRMED.
        CANCEL: ADMIN khi PENDING, hoặc CONFIRMED nếu có reason. CUSTOMER chỉ CANCEL khi PENDING.
        SHIP: ADMIN hoặc đối tác, CONFIRMED → SHIPPING.
        FAIL_DELIVERY: ADMIN hoặc đối tác, SHIPPING → CONFIRMED để giao lại.
        DELIVER: ADMIN hoặc đối tác, SHIPPING → DELIVERED.
        REQUEST_RETURN: CUSTOMER hoặc ADMIN, DELIVERED → RETURN_REQUESTED, trong 7 ngày.
        ACCEPT_RETURN: ADMIN, RETURN_REQUESTED → RETURNED.
      enum:
      - CONFIRM
      - CANCEL
      - SHIP
      - FAIL_DELIVERY
      - DELIVER
      - REQUEST_RETURN
      - ACCEPT_RETURN
  securitySchemes:
    bearerAuth:
      type: http
      description: JWT HS256. Claim role là CUSTOMER hoặc ADMIN. CUSTOMER kèm customerId.
      scheme: bearer
      bearerFormat: JWT
